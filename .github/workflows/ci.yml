name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes cost ~30 runner-minutes for nothing: no code, image or
    # manifest is affected. (pull_request has the same filter.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  workflow_dispatch:   # run everything by hand from the Actions tab
  schedule:
    - cron: "17 3 * * *"   # nightly: every job runs, incl. fuzz and deploy

# A newer push to the same ref supersedes an older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # incremental state just bloats the cache
  RUSTFLAGS: "-D warnings"

jobs:
  # Decides which path-scoped jobs run (logic + tests: .github/scripts/changes.sh).
  # Schedule / manual runs, a workflow edit, or a failed diff run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.f.outputs.ui }}
      plugins: ${{ steps.f.outputs.plugins }}
      tunnel: ${{ steps.f.outputs.tunnel }}
      deploy: ${{ steps.f.outputs.deploy }}
      fuzz: ${{ steps.f.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Self-test the change detection
        run: sh .github/scripts/changes_test.sh
      - name: Detect changed areas
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          flag=""
          files=""
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || flag=--all ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || flag=--all
              else
                flag=--all   # new branch / force-push: no usable base
              fi ;;
            *) flag=--all ;;
          esac
          printf '%s\n' "$files" | sh .github/scripts/changes.sh $flag | tee -a "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-cache
        with: { name: test }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all

  plugins:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cache
        with:
          name: plugins
          target-dirs: |
            target
            crates/plugins/target
      - name: Native unit tests
        working-directory: crates/plugins
        run: cargo test --workspace
      - name: Build to wasm32-unknown-unknown
        working-directory: crates/plugins
        run: cargo build --release --target wasm32-unknown-unknown -p a2s -p minecraft -p regex-firstbytes
      - name: Size check (informational)
        working-directory: crates/plugins
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm
      - name: Load the built plugins through the real gsp loader (phase 9 slices 5–7)
        # Runs the #[ignore]d gsp tests that need crates/plugins built above:
        # the end-to-end artifact test and the WASM-boundary latency bench
        # vs. NFR N1 (release matters for real numbers — see docs/07).
        run: cargo test -p gsp --release -- --ignored --nocapture

  ui:
    # gsp-ui frontend (crates/gsp-ui/web) — a standalone npm project, so it
    # gets its own job rather than riding on `make check`.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/gsp-ui/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gsp-ui/web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck + build
        run: npm run build

  tunnel:
    # Phase-14 WireGuard tunnel e2e in rootless network namespaces
    # (docs/superpowers/specs/2026-10-01-tunnel-e2e-design.md). Non-blocking
    # until it has proven stable on GitHub runners.
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        backend: [kernel, userspace]
    env:
      TUNNEL_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cache
        with: { name: tunnel }
      - name: Allow unprivileged user namespaces (Ubuntu AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Load the wireguard kernel module
        run: sudo modprobe wireguard || true
      - name: Tunnel e2e
        run: make tunnel-e2e

  deploy:
    # deploy/ reference images + compose demo + k8s manifests
    # (docs/superpowers/specs/2026-10-01-deploy-design.md). Non-blocking until
    # it has proven stable on GitHub runners.
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Static checks (compose render, k8s wiring)
        run: make deploy-lint
      - name: Build all five images and run --version on each
        run: make deploy-images
      - name: Compose smoke test
        run: make deploy-smoke
      - name: Validate Kubernetes manifests (schema only)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary deploy/k8s

  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gsp-config/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: crates/gsp-config
        # `+nightly` overrides the repo's stable rust-toolchain.toml, which
        # cargo-fuzz's sanitizer flags need.
        run: cargo +nightly fuzz build
      - name: Smoke-run each target
        working-directory: crates/gsp-config
        run: |
          for t in extract_sni route_match parse_config; do
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=45
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/gsp-config/fuzz/artifacts/**
          if-no-files-found: ignore
