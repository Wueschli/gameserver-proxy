name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes cost ~30 runner-minutes for nothing: no code, image or
    # manifest is affected.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  # No paths-ignore here: the ruleset requires `ci-ok`, so a docs-only PR must
  # still start the workflow. The `code` output of `changes` skips the heavy jobs.
  pull_request:
  workflow_dispatch:   # run everything by hand from the Actions tab
  schedule:
    - cron: "17 3 * * *"   # nightly: every job runs, incl. fuzz and deploy

# A newer push to the same ref supersedes an older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # incremental state just bloats the cache
  RUSTFLAGS: "-D warnings"

# Every job is pinned to ubuntu-24.04 rather than ubuntu-latest (which becomes
# Ubuntu 26 on 2026-10-19): the release-binary jobs for glibc (see build-release),
# the rest so a runner-image migration is a deliberate edit, not a surprise red run
# (tunnel depends on the AppArmor userns sysctl and the wireguard module), and so
# caches stay on one image. Move them together when upgrading.
# Read-only GITHUB_TOKEN for every job: nothing here pushes, comments or
# releases, so a compromised step or action cannot write to the repo.
permissions:
  contents: read

jobs:
  # Decides which path-scoped jobs run (logic + tests: .github/scripts/changes.py):
  # the Cargo packages a change touches, plus their dependents per `cargo
  # metadata`, against the packages each job builds. Schedule / manual runs, a
  # workflow edit, a failed diff or a failed `cargo metadata` run everything.
  changes:
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    env:
      # The runner image's preinstalled stable cargo is enough for `cargo
      # metadata --no-deps`; skip rust-toolchain.toml's component installs.
      RUSTUP_TOOLCHAIN: stable
    outputs:
      ui: ${{ steps.f.outputs.ui }}
      sniffers: ${{ steps.f.outputs.sniffers }}
      tunnel: ${{ steps.f.outputs.tunnel }}
      deploy: ${{ steps.f.outputs.deploy }}
      fuzz: ${{ steps.f.outputs.fuzz }}
      release: ${{ steps.f.outputs.release }}
      code: ${{ steps.f.outputs.code }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Self-test the change detection and the report renderer
        run: |
          python3 .github/scripts/changes_test.py
          python3 .github/scripts/test_summary_test.py
          python3 .github/scripts/trivy_summary_test.py
          python3 .github/scripts/audit_summary_test.py
          python3 .github/scripts/sarif_categories_test.py
          python3 .github/scripts/check_release_test.py
          python3 .github/scripts/check_md_links_test.py
      - name: Detect changed areas
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          flag=""
          files=""
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || flag=--all ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || flag=--all
              else
                flag=--all   # new branch / force-push: no usable base
              fi ;;
            *) flag=--all ;;
          esac
          printf '%s\n' "$files" | python3 .github/scripts/changes.py $flag | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-cache
        with: { name: test }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      # Alone, wayhouse-agent pulls wayhouse-http without its default `server` feature;
      # every other build here unifies it on, so this is the only one that
      # proves the client-only build still compiles.
      - name: Check wayhouse-agent (wayhouse-http without `server`)
        run: cargo check -p wayhouse-agent --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --profile ci --workspace
      # The minimal edge build (issue #62): every optional `wayhouse` cargo feature off.
      - name: Minimal build (clippy + tests)
        run: |
          cargo clippy -p wayhouse --no-default-features --all-targets
          cargo nextest run --profile ci -p wayhouse --no-default-features
          cargo clippy -p wayhouse-core --no-default-features --all-targets
          cargo nextest run --profile ci -p wayhouse-core --no-default-features
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "test" target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-test
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # Static musl build (issue #55): the five binaries must keep compiling for
  # x86_64-unknown-linux-musl, and the transparent-socket options must still be
  # known to a musl libc. Rides the `release` gate (sniffers or deploy paths touched).
  musl:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc and musl-gcc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: ./.github/actions/cargo-cache
        with: { name: musl }
      - name: Build the binaries for musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --target x86_64-unknown-linux-musl -p wayhouse -p wayhouse-controller -p wayhouse-aggregator -p wayhouse-ui -p wayhouse-agent
      - name: Socket options on musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test --locked --target x86_64-unknown-linux-musl -p wayhouse-core --lib -- net

  # One release compile shared by the jobs that need release binaries: the
  # sniffers tests restore this job's cache snapshot (same `release` namespace and
  # key, so they reuse the compiled dependencies) and deploy takes the binaries
  # as an artifact. Nightly, deploy ignores the artifact and compiles inside
  # Docker instead, so the self-contained Dockerfile path can't rot.
  # Pinned to ubuntu-24.04 (glibc 2.39), like sniffers and deploy: binaries built on
  # a newer runner image (ubuntu-latest becomes 26 on 2026-10-19) could need a newer
  # glibc than the Debian 13 distroless runtime (2.41) has, and fail to start; the
  # cache is also only reused between jobs on the same image.
  build-release:
    name: build-release (amd64)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: ./.github/actions/cargo-cache
        with: { name: release }
      # cargo-auditable embeds the dependency list in each binary, so Trivy's image
      # scan sees the crates (deploy/scan-images.sh). Same version as the Dockerfile.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.7
      # The minimal edge build of wayhouse (issue #62) first, set aside as wayhouse-minimal for
      # the wayhouse-minimal image; the full build then leaves target/release/wayhouse the full one.
      - name: Build the minimal wayhouse
        run: |
          cargo auditable build --release --locked -p wayhouse --no-default-features
          cp target/release/wayhouse target/release/wayhouse-minimal
      - name: Build the release binaries
        run: cargo auditable build --release --locked -p wayhouse -p wayhouse-controller -p wayhouse-aggregator -p wayhouse-ui -p wayhouse-agent
      # Cargo unifies features per invocation, so the sniffers job's `-p wayhouse` test
      # build (dev-dependencies included) needs different dependency artifacts than
      # the five-binary build above; without this it recompiled ~290 crates even on
      # an exact cache hit. Compile them here so the shared snapshot holds both.
      - name: Warm the dependency set the sniffers tests need
        run: cargo test -p wayhouse --release --locked --no-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binaries
          path: |
            target/release/wayhouse
            target/release/wayhouse-minimal
            target/release/wayhouse-controller
            target/release/wayhouse-aggregator
            target/release/wayhouse-ui
            target/release/wayhouse-agent
          if-no-files-found: error
          retention-days: 1

  # The arm64 counterpart of build-release for the deploy-arm64 job: the x86-64
  # binaries above can't run on arm64, so it compiles its own. Same pins and glibc
  # reasoning; feeds deploy-arm64 and sniffers-arm64.
  build-release-arm64:
    name: build-release (arm64)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm   # free for public repos; glibc 2.39 like the amd64 runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: ./.github/actions/cargo-cache
        with: { name: release-arm64 }
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.7
      - name: Build the minimal wayhouse
        run: |
          cargo auditable build --release --locked -p wayhouse --no-default-features
          cp target/release/wayhouse target/release/wayhouse-minimal
      - name: Build the release binaries
        run: cargo auditable build --release --locked -p wayhouse -p wayhouse-controller -p wayhouse-aggregator -p wayhouse-ui -p wayhouse-agent
      # As in build-release: compile the dependency set the sniffers-arm64 tests need
      # so the shared snapshot holds both.
      - name: Warm the dependency set the sniffers tests need
        run: cargo test -p wayhouse --release --locked --no-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binaries-arm64
          path: |
            target/release/wayhouse
            target/release/wayhouse-minimal
            target/release/wayhouse-controller
            target/release/wayhouse-aggregator
            target/release/wayhouse-ui
            target/release/wayhouse-agent
          if-no-files-found: error
          retention-days: 1

  sniffers:
    name: sniffers (amd64)
    needs: [changes, build-release]
    if: needs.changes.outputs.sniffers == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      # Same namespace + key as build-release => an exact hit on its snapshot:
      # the release dependencies are already compiled (nothing new to save).
      - uses: ./.github/actions/cargo-cache
        with: { name: release }
      # The wasm sniffer workspace is only built here, so it gets its own snapshot.
      - uses: ./.github/actions/cargo-cache
        with:
          name: sniffers-wasm
          target-dirs: crates/sniffers/target
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Native unit tests
        working-directory: crates/sniffers
        # Separate workspace => point nextest at the root config for the `ci` profile.
        run: cargo nextest run --profile ci --workspace --config-file ../../.config/nextest.toml
      - name: Build to wasm32-unknown-unknown
        working-directory: crates/sniffers
        run: cargo build --release --target wasm32-unknown-unknown -p a2s -p minecraft -p quic -p regex-firstbytes -p wireguard -p openvpn -p raknet -p teamspeak3
      - name: Size check (informational)
        working-directory: crates/sniffers
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm
      - name: Load the built sniffers through the real wayhouse loader (phase 9 slices 5–7)
        # Runs the #[ignore]d wayhouse tests that need crates/sniffers built above:
        # the end-to-end artifact test and the WASM-boundary latency bench
        # vs. NFR N1 (release matters for real numbers — see docs/07).
        run: cargo nextest run -p wayhouse --release --profile ci --run-ignored only --no-capture
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "sniffers" crates/sniffers/target/nextest/ci/junit.xml target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-sniffers
          path: |
            crates/sniffers/target/nextest/ci/junit.xml
            target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # The sniffers job on arm64: wasmtime generates native code per architecture, so
  # the real-loader tests and the N1 latency bench are worth running there too.
  # Its own job (not a matrix leg) so the amd64 sniffers job never waits on the
  # arm64 build.
  sniffers-arm64:
    name: sniffers (arm64)
    needs: [changes, build-release-arm64]
    if: needs.changes.outputs.sniffers == 'true'
    runs-on: ubuntu-24.04-arm   # pinned like build-release-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      # Same namespace + key as build-release-arm64 => an exact hit on its snapshot:
      # the release dependencies are already compiled (nothing new to save).
      - uses: ./.github/actions/cargo-cache
        with: { name: release-arm64 }
      # The wasm sniffer workspace is only built here, so it gets its own snapshot.
      - uses: ./.github/actions/cargo-cache
        with:
          name: sniffers-wasm-arm64
          target-dirs: crates/sniffers/target
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Native unit tests
        working-directory: crates/sniffers
        # Separate workspace => point nextest at the root config for the `ci` profile.
        run: cargo nextest run --profile ci --workspace --config-file ../../.config/nextest.toml
      - name: Build to wasm32-unknown-unknown
        working-directory: crates/sniffers
        run: cargo build --release --target wasm32-unknown-unknown -p a2s -p minecraft -p quic -p regex-firstbytes -p wireguard -p openvpn -p raknet -p teamspeak3
      - name: Size check (informational)
        working-directory: crates/sniffers
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm
      - name: Load the built sniffers through the real wayhouse loader (phase 9 slices 5–7)
        # Runs the #[ignore]d wayhouse tests that need crates/sniffers built above:
        # the end-to-end artifact test and the WASM-boundary latency bench
        # vs. NFR N1 (release matters for real numbers — see docs/07).
        run: cargo nextest run -p wayhouse --release --profile ci --run-ignored only --no-capture
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "sniffers (arm64)" crates/sniffers/target/nextest/ci/junit.xml target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-sniffers-arm64
          path: |
            crates/sniffers/target/nextest/ci/junit.xml
            target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  ui:
    # wayhouse-ui frontend (crates/wayhouse-ui/web) — a standalone npm project, so it
    # gets its own job rather than riding on `make check`.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    defaults:
      run:
        working-directory: crates/wayhouse-ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/wayhouse-ui/web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Test report
        if: always()
        working-directory: .
        run: python3 .github/scripts/test_summary.py --title "ui (vitest)" crates/wayhouse-ui/web/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-ui
          path: crates/wayhouse-ui/web/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Typecheck + build
        run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser e2e (Playwright)
        run: npm run test:e2e

  tunnel:
    # Phase-14 WireGuard tunnel e2e in rootless network namespaces
    # (docs/superpowers/specs/2026-10-01-tunnel-e2e-design.md). Blocking since
    # 2026-10-02, after green runs on both backends on the pinned runners.
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    strategy:
      fail-fast: false
      matrix:
        backend: [kernel, userspace]
    env:
      TUNNEL_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: ./.github/actions/cargo-cache
        with: { name: tunnel }
      - name: Allow unprivileged user namespaces (Ubuntu AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Load the wireguard kernel module
        run: sudo modprobe wireguard || true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Tunnel e2e
        run: make tunnel-e2e-ci
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "tunnel (${{ matrix.backend }})" target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-tunnel-${{ matrix.backend }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy (amd64)
    # deploy/ reference images + compose demo + k8s manifests
    # (docs/superpowers/specs/2026-10-01-deploy-design.md). Blocking since
    # 2026-10-02, after green runs on the pinned runners.
    needs: [changes, build-release]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    env:
      # Push/PR: images copy the shared release build (fast). Nightly: compile
      # inside Docker, exercising the self-contained builder stage.
      BIN_SOURCE: ${{ github.event_name == 'schedule' && 'builder' || 'prebuilt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the shared release binaries
        if: env.BIN_SOURCE == 'prebuilt'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-binaries
          path: deploy/prebuilt
      - name: Static checks (compose render, k8s wiring)
        run: make deploy-lint
      - name: Build all six images and run --version on each
        run: make deploy-images
      # For the trivy job, which has no access to this runner's Docker daemon.
      - name: Save the images for the trivy job
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          for t in wayhouse wayhouse-minimal wayhouse-controller wayhouse-aggregator wayhouse-ui wayhouse-agent; do
            docker save -o "$RUNNER_TEMP/images/$t.tar" "wayhouse-deploy/$t:local"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-images
          path: ${{ runner.temp }}/images/
          retention-days: 1
      - name: Compose smoke test
        run: make deploy-smoke
      - name: Validate Kubernetes manifests (schema only)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary deploy/k8s

  # linux/arm64 images are published next to amd64 (release.yml, issue #88);
  # building them only at release time would find an arm64-only break too late.
  # Mirrors `deploy` on a native arm64 runner (prebuilt binaries on push/PR, the
  # self-contained builder path nightly), minus the static checks and Trivy.
  deploy-arm64:
    name: deploy (arm64)
    needs: [changes, build-release-arm64]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm   # pinned like build-release-arm64
    env:
      BIN_SOURCE: ${{ github.event_name == 'schedule' && 'builder' || 'prebuilt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the arm64 release binaries
        if: env.BIN_SOURCE == 'prebuilt'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-binaries-arm64
          path: deploy/prebuilt
      - name: Build all six images and run --version on each
        run: make deploy-images
      # For the trivy-arm64 job, which has no access to this runner's Docker daemon.
      - name: Save the images for the trivy-arm64 job
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          for t in wayhouse wayhouse-minimal wayhouse-controller wayhouse-aggregator wayhouse-ui wayhouse-agent; do
            docker save -o "$RUNNER_TEMP/images/$t.tar" "wayhouse-deploy/$t:local"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-images-arm64
          path: ${{ runner.temp }}/images/
          retention-days: 1
      - name: Compose smoke test
        run: make deploy-smoke

  # RustSec advisories for every Cargo.lock in the repo (cargo audit): the check
  # Trivy can't do for crates (it sees GHSA only). No build, just the lockfiles
  # and the advisory DB, so it runs on every push / PR and nightly, path-scoped
  # or not. Informational (owner's call): it never fails the run; findings show
  # as a table on the run's summary page and as warning annotations, and the
  # JSON is in the cargo-audit artifact. Accepted advisories:
  # .cargo/audit.toml ([advisories] ignore = [...], each with a reason).
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit (informational)
        continue-on-error: true
        run: sh .github/scripts/cargo_audit.sh target/cargo-audit
      - name: cargo audit report
        if: always()
        run: |
          python3 .github/scripts/audit_summary.py target/cargo-audit >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/audit_summary.py --annotations target/cargo-audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cargo-audit
          path: target/cargo-audit/
          retention-days: 14
          if-no-files-found: ignore

  # Trivy over the deploy job's images and the lockfiles they're built from.
  # Informational (owner's call): the job reports, it never fails — findings show
  # as a table on the run's summary page, as warning annotations, and as JSON +
  # SARIF in the trivy-reports artifact, which is also uploaded to GitHub's
  # Security tab (code scanning; free on this public repo). The upload is skipped
  # for fork PRs, whose token can't write security events. The vulnerability DB
  # (~120 MB) is cached by day: a hit skips the download entirely.
  #
  # Trivy runs from its official image, pinned by digest, as a `docker://` step:
  # a job-level `container:` would need JavaScript actions (checkout, artifacts)
  # to run inside it, which GitHub doesn't support on the Alpine-based image. Not
  # aquasecurity/trivy-action or setup-trivy: in March 2026 their tags were
  # force-pushed to a credential stealer and a backdoored Trivy 0.69.4 was
  # published. The pinned digest is aquasec/trivy:0.75.0, whose trivy binary is
  # byte-identical to the checksum-verified 0.75.0 release tarball (sha256
  # 93f9da8e…299b8e, checked 2026-10-02); re-check when bumping it. The job also
  # cosign-verifies the digest's keyless signature on every run (below).
  trivy:
    name: trivy (amd64)
    needs: [changes, deploy]
    # Also when deploy failed later on (e.g. the smoke test): the images exist.
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    permissions:
      contents: read
      security-events: write   # the SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true   # missing images show up as "not scanned"
        with:
          name: deploy-images
          path: target/images
      # The digest pin stops a later swap of the image; it can't show the image was
      # genuine when pinned. Aqua signs each release image keyless (Sigstore, from
      # the release workflow at a version tag): check that signature on the exact
      # digest the scan step runs, so a digest we pinned by mistake, or one that
      # was never built by their release workflow, fails here. Blocking on purpose:
      # it guards the scanner itself, not a finding.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify the pinned Trivy image's signature
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/aquasecurity/trivy/\.github/workflows/.+@refs/tags/v[0-9.]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      - name: Date for the vulnerability DB cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the vulnerability DB
        id: db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
      # A hit that holds no DB file (a partial save) must not skip the download.
      - name: Check the restored vulnerability DB
        id: dbfile
        run: |
          if [ "${{ steps.db.outputs.cache-hit }}" = true ] && [ -f target/trivy-cache/db/trivy.db ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy scan (informational)
        continue-on-error: true
        uses: docker://aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        env:
          TRIVY_IMAGE_DIR: target/images
          TRIVY_REPORT_DIR: target/trivy
          # The action container mounts the workspace at /github/workspace.
          TRIVY_CACHE_DIR: /github/workspace/target/trivy-cache
          TRIVY_SKIP_DB_UPDATE: ${{ steps.dbfile.outputs.usable == 'true' && 'true' || 'false' }}
        with:
          entrypoint: sh
          args: deploy/scan-images.sh
      # The container ran as root: hand the cache back so the cache post-step
      # (running as the runner user) can read it.
      - name: Take back the cache directory
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/trivy-cache target/trivy 2>/dev/null || true
      - name: Trivy report
        if: always()
        run: |
          python3 .github/scripts/trivy_summary.py target/trivy >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/trivy_summary.py --annotations target/trivy
      - name: Give each SARIF its own code-scanning category
        if: always()
        run: python3 .github/scripts/sarif_categories.py target/trivy
      - name: Upload SARIF to the Security tab
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: target/trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-reports
          path: target/trivy/
          retention-days: 14
          if-no-files-found: ignore

  # The trivy job over the arm64 images. Trivy reads the image tarballs without
  # running them, so it stays on the amd64 runner (its pinned image is the one
  # whose signature is verified below). Reports carry an -arm64 suffix
  # (TRIVY_ARCH, deploy/scan-images.sh); the lockfiles are not scanned twice.
  trivy-arm64:
    name: trivy (arm64)
    needs: [changes, deploy-arm64]
    # Also when deploy failed later on (e.g. the smoke test): the images exist.
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    permissions:
      contents: read
      security-events: write   # the SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true   # missing images show up as "not scanned"
        with:
          name: deploy-images-arm64
          path: target/images
      # The digest pin stops a later swap of the image; it can't show the image was
      # genuine when pinned. Aqua signs each release image keyless (Sigstore, from
      # the release workflow at a version tag): check that signature on the exact
      # digest the scan step runs, so a digest we pinned by mistake, or one that
      # was never built by their release workflow, fails here. Blocking on purpose:
      # it guards the scanner itself, not a finding.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify the pinned Trivy image's signature
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/aquasecurity/trivy/\.github/workflows/.+@refs/tags/v[0-9.]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      - name: Date for the vulnerability DB cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the vulnerability DB
        id: db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
      # A hit that holds no DB file (a partial save) must not skip the download.
      - name: Check the restored vulnerability DB
        id: dbfile
        run: |
          if [ "${{ steps.db.outputs.cache-hit }}" = true ] && [ -f target/trivy-cache/db/trivy.db ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy scan (informational)
        continue-on-error: true
        uses: docker://aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        env:
          TRIVY_IMAGE_DIR: target/images
          TRIVY_ARCH: arm64
          TRIVY_REPORT_DIR: target/trivy
          # The action container mounts the workspace at /github/workspace.
          TRIVY_CACHE_DIR: /github/workspace/target/trivy-cache
          TRIVY_SKIP_DB_UPDATE: ${{ steps.dbfile.outputs.usable == 'true' && 'true' || 'false' }}
        with:
          entrypoint: sh
          args: deploy/scan-images.sh
      # The container ran as root: hand the cache back so the cache post-step
      # (running as the runner user) can read it.
      - name: Take back the cache directory
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target/trivy-cache target/trivy 2>/dev/null || true
      - name: Trivy report
        if: always()
        run: |
          python3 .github/scripts/trivy_summary.py target/trivy >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/trivy_summary.py --annotations target/trivy
      - name: Give each SARIF its own code-scanning category
        if: always()
        run: python3 .github/scripts/sarif_categories.py target/trivy
      - name: Upload SARIF to the Security tab
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: target/trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-reports-arm64
          path: target/trivy/
          retention-days: 14
          if-no-files-found: ignore

  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/wayhouse-config/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: crates/wayhouse-config
        # `+nightly` overrides the repo's stable rust-toolchain.toml, which
        # cargo-fuzz's sanitizer flags need.
        run: cargo +nightly fuzz build
      - name: Smoke-run each target
        working-directory: crates/wayhouse-config
        run: |
          for t in extract_sni route_match parse_config; do
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=45
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts
          path: crates/wayhouse-config/fuzz/artifacts/**
          if-no-files-found: ignore

  # Markdown formatting (Prettier, version pinned in the Makefile) and relative links.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prettier check
        run: make docs-fmt-check
      - name: Relative links and anchors resolve
        run: make docs-links

  # The version policy (RELEASING.md): 0.x only, and Cargo.lock agrees with
  # Cargo.toml. Milliseconds, so no `changes` filter; it also guards release PRs.
  release-policy:
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version policy script and its tests
        run: |
          python3 .github/scripts/check_version_policy_test.py
          python3 .github/scripts/check_version_policy.py

  # The one check the `protect-main` ruleset requires. Always runs (also on
  # docs-only PRs, where every other job is skipped); skipped jobs count as
  # passed, a failed or cancelled one fails the gate.
  ci-ok:
    if: always()
    needs: [changes, test, musl, build-release, build-release-arm64, sniffers, sniffers-arm64, ui, tunnel, deploy, deploy-arm64, audit, trivy, trivy-arm64, fuzz, docs, release-policy]
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
