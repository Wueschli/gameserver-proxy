name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes cost ~30 runner-minutes for nothing: no code, image or
    # manifest is affected. (pull_request has the same filter.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  workflow_dispatch:   # run everything by hand from the Actions tab
  schedule:
    - cron: "17 3 * * *"   # nightly: every job runs, incl. fuzz and deploy

# A newer push to the same ref supersedes an older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # incremental state just bloats the cache
  RUSTFLAGS: "-D warnings"

# Every job is pinned to ubuntu-24.04 rather than ubuntu-latest (which becomes
# Ubuntu 26 on 2026-10-19): the release-binary jobs for glibc (see build-release),
# the rest so a runner-image migration is a deliberate edit, not a surprise red run
# (tunnel depends on the AppArmor userns sysctl and the wireguard module), and so
# caches stay on one image. Move them together when upgrading.
# Read-only GITHUB_TOKEN for every job: nothing here pushes, comments or
# releases, so a compromised step or action cannot write to the repo.
permissions:
  contents: read

jobs:
  # Decides which path-scoped jobs run (logic + tests: .github/scripts/changes.py):
  # the Cargo packages a change touches, plus their dependents per `cargo
  # metadata`, against the packages each job builds. Schedule / manual runs, a
  # workflow edit, a failed diff or a failed `cargo metadata` run everything.
  changes:
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    env:
      # The runner image's preinstalled stable cargo is enough for `cargo
      # metadata --no-deps`; skip rust-toolchain.toml's component installs.
      RUSTUP_TOOLCHAIN: stable
    outputs:
      ui: ${{ steps.f.outputs.ui }}
      plugins: ${{ steps.f.outputs.plugins }}
      tunnel: ${{ steps.f.outputs.tunnel }}
      deploy: ${{ steps.f.outputs.deploy }}
      fuzz: ${{ steps.f.outputs.fuzz }}
      release: ${{ steps.f.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test the change detection and the report renderer
        run: |
          python3 .github/scripts/changes_test.py
          python3 .github/scripts/test_summary_test.py
          python3 .github/scripts/trivy_summary_test.py
          python3 .github/scripts/audit_summary_test.py
      - name: Detect changed areas
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          flag=""
          files=""
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || flag=--all ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || flag=--all
              else
                flag=--all   # new branch / force-push: no usable base
              fi ;;
            *) flag=--all ;;
          esac
          printf '%s\n' "$files" | python3 .github/scripts/changes.py $flag | tee -a "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-cache
        with: { name: test }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      # Alone, gsp-agent pulls gsp-http without its default `server` feature;
      # every other build here unifies it on, so this is the only one that
      # proves the client-only build still compiles.
      - name: Check gsp-agent (gsp-http without `server`)
        run: cargo check -p gsp-agent --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --profile ci --workspace
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "test" target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # One release compile shared by the jobs that need release binaries: the
  # plugins tests restore this job's cache snapshot (same `release` namespace and
  # key, so they reuse the compiled dependencies) and deploy takes the binaries
  # as an artifact. Nightly, deploy ignores the artifact and compiles inside
  # Docker instead, so the self-contained Dockerfile path can't rot.
  # Pinned to ubuntu-24.04 (glibc 2.39), like plugins and deploy: binaries built on
  # a newer runner image (ubuntu-latest becomes 26 on 2026-10-19) could need a newer
  # glibc than the Debian 13 distroless runtime (2.41) has, and fail to start; the
  # cache is also only reused between jobs on the same image.
  build-release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cache
        with: { name: release }
      - name: Build the release binaries
        run: cargo build --release --locked -p gsp -p gsp-controller -p gsp-aggregator -p gsp-ui -p gsp-agent
      # Cargo unifies features per invocation, so the plugins job's `-p gsp` test
      # build (dev-dependencies included) needs different dependency artifacts than
      # the five-binary build above; without this it recompiled ~290 crates even on
      # an exact cache hit. Compile them here so the shared snapshot holds both.
      - name: Warm the dependency set the plugins tests need
        run: cargo test -p gsp --release --locked --no-run
      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            target/release/gsp
            target/release/gsp-controller
            target/release/gsp-aggregator
            target/release/gsp-ui
            target/release/gsp-agent
          if-no-files-found: error
          retention-days: 1

  plugins:
    needs: [changes, build-release]
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Same namespace + key as build-release => an exact hit on its snapshot:
      # the release dependencies are already compiled (nothing new to save).
      - uses: ./.github/actions/cargo-cache
        with: { name: release }
      # The wasm plugin workspace is only built here, so it gets its own snapshot.
      - uses: ./.github/actions/cargo-cache
        with:
          name: plugins-wasm
          target-dirs: crates/plugins/target
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Native unit tests
        working-directory: crates/plugins
        # Separate workspace => point nextest at the root config for the `ci` profile.
        run: cargo nextest run --profile ci --workspace --config-file ../../.config/nextest.toml
      - name: Build to wasm32-unknown-unknown
        working-directory: crates/plugins
        run: cargo build --release --target wasm32-unknown-unknown -p a2s -p minecraft -p regex-firstbytes
      - name: Size check (informational)
        working-directory: crates/plugins
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm
      - name: Load the built plugins through the real gsp loader (phase 9 slices 5–7)
        # Runs the #[ignore]d gsp tests that need crates/plugins built above:
        # the end-to-end artifact test and the WASM-boundary latency bench
        # vs. NFR N1 (release matters for real numbers — see docs/07).
        run: cargo nextest run -p gsp --release --profile ci --run-ignored only --no-capture
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "plugins" crates/plugins/target/nextest/ci/junit.xml target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-plugins
          path: |
            crates/plugins/target/nextest/ci/junit.xml
            target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  ui:
    # gsp-ui frontend (crates/gsp-ui/web) — a standalone npm project, so it
    # gets its own job rather than riding on `make check`.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    defaults:
      run:
        working-directory: crates/gsp-ui/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gsp-ui/web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Test report
        if: always()
        working-directory: .
        run: python3 .github/scripts/test_summary.py --title "ui (vitest)" crates/gsp-ui/web/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-ui
          path: crates/gsp-ui/web/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Typecheck + build
        run: npm run build

  tunnel:
    # Phase-14 WireGuard tunnel e2e in rootless network namespaces
    # (docs/superpowers/specs/2026-10-01-tunnel-e2e-design.md). Blocking since
    # 2026-10-02, after green runs on both backends on the pinned runners.
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    strategy:
      fail-fast: false
      matrix:
        backend: [kernel, userspace]
    env:
      TUNNEL_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cache
        with: { name: tunnel }
      - name: Allow unprivileged user namespaces (Ubuntu AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Load the wireguard kernel module
        run: sudo modprobe wireguard || true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Tunnel e2e
        run: make tunnel-e2e-ci
      - name: Test report
        if: always()
        run: python3 .github/scripts/test_summary.py --title "tunnel (${{ matrix.backend }})" target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-tunnel-${{ matrix.backend }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    # deploy/ reference images + compose demo + k8s manifests
    # (docs/superpowers/specs/2026-10-01-deploy-design.md). Blocking since
    # 2026-10-02, after green runs on the pinned runners.
    needs: [changes, build-release]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04   # pinned: see the build-release comment (glibc)
    env:
      # Push/PR: images copy the shared release build (fast). Nightly: compile
      # inside Docker, exercising the self-contained builder stage.
      BIN_SOURCE: ${{ github.event_name == 'schedule' && 'builder' || 'prebuilt' }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the shared release binaries
        if: env.BIN_SOURCE == 'prebuilt'
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: deploy/prebuilt
      - name: Static checks (compose render, k8s wiring)
        run: make deploy-lint
      - name: Build all five images and run --version on each
        run: make deploy-images
      # For the trivy job, which has no access to this runner's Docker daemon.
      - name: Save the images for the trivy job
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          for t in gsp gsp-controller gsp-aggregator gsp-ui gsp-agent; do
            docker save -o "$RUNNER_TEMP/images/$t.tar" "gsp-deploy/$t:local"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-images
          path: ${{ runner.temp }}/images/
          retention-days: 1
      - name: Compose smoke test
        run: make deploy-smoke
      - name: Validate Kubernetes manifests (schema only)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary deploy/k8s

  # RustSec advisories for every Cargo.lock in the repo (cargo audit): the check
  # Trivy can't do for crates (it sees GHSA only). No build, just the lockfiles
  # and the advisory DB, so it runs on every push / PR and nightly, path-scoped
  # or not. Informational (owner's call): it never fails the run; findings show
  # as a table on the run's summary page and as warning annotations, and the
  # JSON is in the cargo-audit artifact. Accepted advisories:
  # .cargo/audit.toml ([advisories] ignore = [...], each with a reason).
  audit:
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit (informational)
        continue-on-error: true
        run: sh .github/scripts/cargo_audit.sh target/cargo-audit
      - name: cargo audit report
        if: always()
        run: |
          python3 .github/scripts/audit_summary.py target/cargo-audit >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/audit_summary.py --annotations target/cargo-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-audit
          path: target/cargo-audit/
          retention-days: 14
          if-no-files-found: ignore

  # Trivy over the deploy job's images and the lockfiles they're built from.
  # Informational (owner's call): the job reports, it never fails — findings show
  # as a table on the run's summary page, as warning annotations, and as JSON +
  # SARIF in the trivy-reports artifact (GitHub's Security tab would take the
  # SARIF, but on a private repo only with GitHub Code Security enabled).
  #
  # Trivy runs from its official image, pinned by digest, as a `docker://` step:
  # a job-level `container:` would need JavaScript actions (checkout, artifacts)
  # to run inside it, which GitHub doesn't support on the Alpine-based image. Not
  # aquasecurity/trivy-action or setup-trivy: in March 2026 their tags were
  # force-pushed to a credential stealer and a backdoored Trivy 0.69.4 was
  # published. The pinned digest is aquasec/trivy:0.75.0, whose trivy binary is
  # byte-identical to the checksum-verified 0.75.0 release tarball (sha256
  # 93f9da8e…299b8e, checked 2026-10-02); re-check when bumping it.
  trivy:
    needs: [changes, deploy]
    # Also when deploy failed later on (e.g. the smoke test): the images exist.
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true   # missing images show up as "not scanned"
        with:
          name: deploy-images
          path: target/images
      - name: Trivy scan (informational)
        continue-on-error: true
        uses: docker://aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        env:
          TRIVY_IMAGE_DIR: target/images
          TRIVY_REPORT_DIR: target/trivy
        with:
          entrypoint: sh
          args: deploy/scan-images.sh
      - name: Trivy report
        if: always()
        run: |
          python3 .github/scripts/trivy_summary.py target/trivy >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/trivy_summary.py --annotations target/trivy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-reports
          path: target/trivy/
          retention-days: 14
          if-no-files-found: ignore

  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04   # pinned: see the comment above `jobs:`
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gsp-config/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        working-directory: crates/gsp-config
        # `+nightly` overrides the repo's stable rust-toolchain.toml, which
        # cargo-fuzz's sanitizer flags need.
        run: cargo +nightly fuzz build
      - name: Smoke-run each target
        working-directory: crates/gsp-config
        run: |
          for t in extract_sni route_match parse_config; do
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=45
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/gsp-config/fuzz/artifacts/**
          if-no-files-found: ignore
