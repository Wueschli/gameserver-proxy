# Lets gsp's `kubernetes` backend sources read EndpointSlices (docs/05). The Role
# lives in the namespace the source's `namespace:` names (`games` here; edit it,
# and create it, to match). One RoleBinding per watched namespace.
apiVersion: v1
kind: ServiceAccount
metadata: { name: gsp, namespace: gsp }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: gsp-endpointslices, namespace: games }
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    # list: the poll and the watch's starting point; watch: instant updates
    # (without it gsp still converges on refresh_interval_sec).
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: gsp-endpointslices, namespace: games }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gsp-endpointslices
subjects:
  - { kind: ServiceAccount, name: gsp, namespace: gsp }
