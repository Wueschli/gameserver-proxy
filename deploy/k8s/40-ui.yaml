apiVersion: apps/v1
kind: Deployment
metadata: { name: wayhouse-ui, namespace: wayhouse }
spec:
  replicas: 1
  selector: { matchLabels: { app: wayhouse-ui } }
  template:
    metadata: { labels: { app: wayhouse-ui } }
    spec:
      securityContext: { runAsNonRoot: true }
      # Private GHCR images: uncomment (see deploy/README.md "Pulling private images").
      # imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: ui
          image: wayhouse-deploy/wayhouse-ui:local
          args:
            - --listen=0.0.0.0:9903
            - --ui-password=$(UI_PASSWORD)
            - --controller-url=http://wayhouse-controller:9901
            - --controller-token=$(CONTROLLER_TOKEN)
            - --aggregator-url=http://wayhouse-aggregator:9902
            - --aggregator-token=$(AGGREGATOR_TOKEN)
          env:
            - name: UI_PASSWORD
              valueFrom: { secretKeyRef: { name: wayhouse-tokens, key: ui-password } }
            - name: CONTROLLER_TOKEN
              valueFrom: { secretKeyRef: { name: wayhouse-tokens, key: controller-token } }
            - name: AGGREGATOR_TOKEN
              valueFrom: { secretKeyRef: { name: wayhouse-tokens, key: aggregator-token } }
          ports: [{ containerPort: 9903 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9903 } }
          livenessProbe: { httpGet: { path: /healthz, port: 9903 }, initialDelaySeconds: 10 }
---
# ClusterIP only: front it with an Ingress / LoadBalancer (and TLS) yourself.
apiVersion: v1
kind: Service
metadata: { name: wayhouse-ui, namespace: wayhouse }
spec:
  selector: { app: wayhouse-ui }
  ports: [{ port: 9903, targetPort: 9903 }]
