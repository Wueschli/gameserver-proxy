[workspace]
resolver = "2"
members = [
    "crates/wayhouse-config",
    "crates/wayhouse-core",
    "crates/wayhouse",
    "crates/wayhouse-bench",
    "crates/wayhouse-controller",
    "crates/wayhouse-aggregator",
    "crates/wayhouse-ui",
    "crates/wayhouse-agent",
    "crates/wayhouse-fleet-tests",
    "crates/wayhouse-http",
    "crates/wayhouse-registry",
    "crates/sniffer-abi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wayhouse-proxy/wayhouse"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
    "signal",
    "sync",
] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arc-swap = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.29", features = ["socket", "net", "uio", "fs", "time", "zerocopy", "resource"] }
async-trait = "0.1"
serde_json = "1"
lru = "0.18"
maxminddb = { version = "0.30", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
notify = "6"
hickory-resolver = "0.26"
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
wat = "1"
# Reads a sniffer module's `wayhouse.abi` custom section without compiling it; same
# version wasmtime already pulls in.
wasmparser = { version = "0.254", default-features = false, features = ["std"] }
sha2 = "0.10"
semver = { version = "1", features = ["serde"] }
# Verification only (no signing code in the product); the maintainer signs in CI with
# the minisign CLI. Used by wayhouse-registry.
minisign-verify = "0.3"
toml = "0.8"
sled = "0.34"
tempfile = "3"
wayhouse-http = { path = "crates/wayhouse-http", default-features = false }
# Native TLS servers (wayhouse-http's `server` feature) and the test TLS terminator in
# wayhouse-fleet-tests; same ring provider reqwest uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
similar = "2"
rand = "0.8"
# Phase 14 backend transport (docs/11): used by both `wayhouse-agent` (the
# origin-side agent) and `wayhouse` itself (slice 4's proxy-side reconcile task),
# so — unlike a single-crate dependency such as `foca`/`openraft` — this one
# earns a shared workspace entry rather than two independently-pinned copies.
defguard_wireguard_rs = "0.12"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"

# A curated pedantic subset (docs/tech-debt P12); the documentation lints
# (`missing_errors_doc`, `must_use_candidate`, ...) are deliberately left out.
[workspace.lints.clippy]
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
default_trait_access = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
