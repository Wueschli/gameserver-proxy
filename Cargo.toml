[workspace]
resolver = "2"
members = [
    "crates/gsp-config",
    "crates/gsp-core",
    "crates/gsp",
    "crates/gsp-bench",
    "crates/gsp-controller",
    "crates/gsp-aggregator",
    "crates/gsp-ui",
    "crates/gsp-agent",
    "crates/gsp-fleet-tests",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wueschli/gameserver-proxy"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
    "signal",
    "sync",
] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arc-swap = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.29", features = ["socket", "net", "uio", "fs", "time", "zerocopy", "resource"] }
async-trait = "0.1"
serde_json = "1"
lru = "0.18"
maxminddb = { version = "0.30", default-features = false }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
notify = "6"
hickory-resolver = "0.26"
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
wat = "1"
sha2 = "0.10"
sled = "0.34"
tempfile = "3"
tokio-stream = "0.1"
similar = "2"
rand = "0.8"
# Phase 14 backend transport (docs/11): used by both `gsp-agent` (the
# origin-side agent) and `gsp` itself (slice 4's proxy-side reconcile task),
# so — unlike a single-crate dependency such as `foca`/`openraft` — this one
# earns a shared workspace entry rather than two independently-pinned copies.
defguard_wireguard_rs = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
