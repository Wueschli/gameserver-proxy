# gsp — reduced v0 schema (roadmap phase 2).
# The full target schema is documented in docs/05-configuration.md.

settings:
  # Accept-loop tasks per listener. 0 = one per CPU core.
  workers: 0
  admin:
    listen: "127.0.0.1:9900"   # /healthz /readyz /metrics /pools

pools:
  - name: local
    targets:
      - "127.0.0.1:9001"
      - "127.0.0.1:9002"
    balancer: round_robin        # or: least_conn
    connect_timeout_ms: 300
    idle_timeout_sec: 90
    health_check:
      type: tcp_connect
      interval_sec: 2
      timeout_ms: 500
      rise: 2                     # consecutive OK checks to mark healthy
      fall: 3                     # consecutive failed checks to mark unhealthy
    per_backend:
      max_sessions: 500           # optional; omit for uncapped

  - name: realtime
    targets:
      - "127.0.0.1:27015"
      - "127.0.0.1:27016"
    balancer: least_conn
    idle_timeout_sec: 30           # UDP session idle eviction
    health_check:
      type: udp_probe             # send a payload, expect a reply datagram
      send_hex: "ffffffff54536f7572636520456e67696e6520517565727900"
      expect_hex_prefix: "ffffffff49"
      interval_sec: 2
      timeout_ms: 500
      rise: 2
      fall: 3

listeners:
  # A listener maps to a pool either with the `pool:` shorthand (one implicit
  # `always` route) ...
  - name: public-udp
    bind: "0.0.0.0:27015"
    protocol: udp
    pool: realtime
    affinity:
      hash_on: src_ip             # src_ip (default for udp) | src_ip_port

  # ... or with a priority-ordered `routes` list; the first matching rule wins.
  # Matchers: `always`; `client_cidr` (source-IP prefixes); `port` (destination
  # port, bare int or "lo-hi" range); `first_bytes` (prefix of the first bytes —
  # TCP peek / first UDP datagram — as `hex:...` or `ascii:...`, <= 512 bytes).
  # `pool` and `routes` are mutually exclusive.
  - name: public-tcp
    bind: "0.0.0.0:7777"
    protocol: tcp
    routes:
      - match: { type: client_cidr, cidrs: ["10.0.0.0/8"] }
        action: { pool: local }
      - match: { type: port, ports: [7777, "8000-8100"] }
        action: { pool: local }
      - match: { type: always }
        action: { pool: local }

  - name: query-and-game
    bind: "0.0.0.0:27016"
    protocol: udp
    routes:
      # Valve A2S query packets start with the 0xFFFFFFFF connectionless header.
      - match: { type: first_bytes, prefix: "hex:ffffffff" }
        action: { pool: realtime }
      - match: { type: always }
        action: { pool: realtime }

# Reload without restart: `kill -HUP <pid>` or just edit this file.
# Live: pool targets, balancer, health-check params, caps.
# Restart-only: listener bind / protocol / routes / affinity.
# Note: a UDP session reads idle_timeout_sec once at creation; a reload that
# changes it applies to sessions opened afterwards.
