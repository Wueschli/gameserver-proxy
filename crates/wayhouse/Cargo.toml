[package]
name = "wayhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "wayhouse"

[[bin]]
name = "wayhouse"
path = "src/main.rs"

[features]
# Cargo features carve a minimal edge build out of `wayhouse` (issue #62):
# `cargo build -p wayhouse --no-default-features`. Everything is on by default;
# turning one off makes a config that needs it fail at startup, never silently
# run without it.
default = ["wasm-sniffers", "grpc-resolver", "dns-srv", "gossip", "tunnel"]
# WASM sniffer plugin loader (`settings.sniffers`); pulls in `wasmtime`.
wasm-sniffers = ["dep:wasmtime", "dep:wasmparser"]
# `backend_sources[].type: dns_srv`; pulls in `hickory-resolver`.
dns-srv = ["dep:hickory-resolver"]
# Tier-2 regional health fabric (`settings.gossip`); pulls in `foca`, `postcard`
# and `hmac` through `wayhouse-core`.
gossip = ["wayhouse-core/gossip"]
# WireGuard backend transport (`--tunnel-*`, `backend_sources[].type: tunnel`);
# pulls in `defguard_wireguard_rs` and the netlink crates.
tunnel = [
    "dep:defguard_wireguard_rs",
    "dep:netlink-packet-core",
    "dep:netlink-packet-route",
    "dep:netlink-sys",
    "dep:rand",
]
# gRPC external resolver (`resolvers[].kind: grpc`); pulls in `tonic`/`prost` and
# needs `protoc` at build time.
grpc-resolver = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:tonic-prost-build"]

[lints]
workspace = true

[dependencies]
wayhouse-http = { workspace = true, features = ["server"] }
wayhouse-config = { path = "../wayhouse-config" }
wayhouse-core = { path = "../wayhouse-core", default-features = false }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
notify.workspace = true
hickory-resolver = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }
sha2.workspace = true
nix.workspace = true
defguard_wireguard_rs = { workspace = true, optional = true }
netlink-packet-core = { workspace = true, optional = true }
netlink-packet-route = { workspace = true, optional = true }
netlink-sys = { workspace = true, optional = true }
# `--tunnel-*`: the per-process boot id `proxy_register` sends.
rand = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hickory-server = { version = "0.26", features = ["testing"] }
wat.workspace = true
tempfile.workspace = true
