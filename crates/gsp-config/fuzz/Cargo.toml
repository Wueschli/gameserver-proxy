[package]
name = "gsp-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone: not a member of the repo's workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.gsp-config]
path = ".."

[[bin]]
name = "extract_sni"
path = "fuzz_targets/extract_sni.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_match"
path = "fuzz_targets/route_match.rs"
test = false
doc = false
bench = false
