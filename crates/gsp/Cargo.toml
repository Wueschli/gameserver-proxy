[package]
name = "gsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "gsp"

[[bin]]
name = "gsp"
path = "src/main.rs"

[features]
# Cargo features carve a minimal edge build out of `gsp` (issue #62):
# `cargo build -p gsp --no-default-features`. Everything is on by default;
# turning one off makes a config that needs it fail at startup, never silently
# run without it.
default = ["wasm-sniffers"]
# WASM sniffer plugin loader (`settings.sniffers`); pulls in `wasmtime`.
wasm-sniffers = ["dep:wasmtime"]

[dependencies]
gsp-http.workspace = true
gsp-config = { path = "../gsp-config" }
gsp-core = { path = "../gsp-core" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tonic.workspace = true
prost.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
notify.workspace = true
hickory-resolver.workspace = true
wasmtime = { workspace = true, optional = true }
sha2.workspace = true
nix.workspace = true
defguard_wireguard_rs.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hickory-server = { version = "0.26", features = ["testing"] }
wat.workspace = true
tempfile.workspace = true
