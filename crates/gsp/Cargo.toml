[package]
name = "gsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "gsp"

[[bin]]
name = "gsp"
path = "src/main.rs"

[features]
# Cargo features carve a minimal edge build out of `gsp` (issue #62):
# `cargo build -p gsp --no-default-features`. Everything is on by default;
# turning one off makes a config that needs it fail at startup, never silently
# run without it.
default = ["wasm-sniffers", "grpc-resolver", "dns-srv"]
# WASM sniffer plugin loader (`settings.sniffers`); pulls in `wasmtime`.
wasm-sniffers = ["dep:wasmtime"]
# `backend_sources[].type: dns_srv`; pulls in `hickory-resolver`.
dns-srv = ["dep:hickory-resolver"]
# gRPC external resolver (`resolvers[].kind: grpc`); pulls in `tonic`/`prost` and
# needs `protoc` at build time.
grpc-resolver = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:tonic-prost-build"]

[lints]
workspace = true

[dependencies]
gsp-http = { workspace = true, features = ["server"] }
gsp-config = { path = "../gsp-config" }
gsp-core = { path = "../gsp-core" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
notify.workspace = true
hickory-resolver = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
sha2.workspace = true
nix.workspace = true
defguard_wireguard_rs.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys.workspace = true
# `--tunnel-*`: the per-process boot id `proxy_register` sends.
rand.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hickory-server = { version = "0.26", features = ["testing"] }
wat.workspace = true
tempfile.workspace = true
