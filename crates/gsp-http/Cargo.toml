[package]
name = "gsp-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The one place the fleet binaries build outbound HTTP clients (`--ca-file`).
# Deliberately reqwest-only: gsp-aggregator and gsp-ui depend on it and must
# stay free of gsp-core / gsp-config.

[features]
# The shared axum bearer-auth middleware (`server` module). Off by default so
# client-only users (gsp-agent) don't pull axum in.
server = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
reqwest.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
